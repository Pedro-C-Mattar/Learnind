<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Categorias | Learnind</title>
	<!-- load page css (served from /categoria/cat.css) and shared common.css -->
		<!-- reuse perfil styles for header/footer and page layout -->
		<link rel="stylesheet" href="/perfil/perfil.css">
		<link rel="stylesheet" href="cat.css">
		<link rel="stylesheet" href="/common.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<style>
		/* small inline convenience to ensure modals are above other layout */
	</style>
</head>
<body>
		<!-- ===== HEADER ===== -->
		<header>
			<div class="container header-content">
				<h1 class="logo"><a id="logo-link" href="/landPage/index.html">Learnind</a></h1>

				<!-- search removed on this page (only on dashboard) -->

				<nav>
					<ul>
						<!-- navigation links removed; kept empty intentionally -->
					</ul>
				</nav>

						<div class="profile">
							<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Perfil" class="avatar" onclick="window.location.href='/perfil/perfil.html'" />
						</div>
			</div>
		</header>

		<main class="profile-container">
			<section class="profile-card categories">
				<div class="toolbar">
					<h2 style="color:#4c1d95">Categorias</h2>
					<button id="btn-add" class="btn purple"><i class="fa fa-plus"></i> Adicionar Categoria</button>
				</div>

				<div id="cards" class="cards-grid">
					<!-- category cards injected here -->
				</div>
			</section>
		</main>

	<!-- Add / Edit Modal -->
	<div id="modal" class="modal hidden">
		<div class="modal-content">
			<h3 id="modal-title">Adicionar Categoria</h3>
			<form id="modal-form">
				<input type="hidden" id="cat-id" name="id">
				<label for="cat-nome">Nome</label>
				<input type="text" id="cat-nome" name="nome" required>
						<div class="modal-actions">
							<button type="button" id="modal-cancel" class="btn delete">Cancelar</button>
							<button type="submit" class="btn purple">Salvar</button>
						</div>
			</form>
		</div>
	</div>

	<script src="cat.js"></script>

		<!-- ===== FOOTER ===== -->
			<footer>
				<p>© 2025 Learnind — <a href="#">Termos</a> • <a href="#">Privacidade</a></p>
			</footer>
</body>
</html>
