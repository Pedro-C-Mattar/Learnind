<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula - Learnind</title>
  <link rel="stylesheet" href="video.css">
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="container header-content">
      <h1 class="logo"><a id="logo-link" href="/landPage/index.html">Learnind</a></h1>

      <!-- search removed on this page (only on dashboard) -->

      <nav>
        <ul>
          <!-- navigation links removed; kept empty intentionally -->
        </ul>
      </nav>

      <!-- ÍCONE DE PERFIL -->
      <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Perfil" onclick="window.location.href='../perfil/perfil.html'" class="avatar">
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTAINER ===== -->
  <main class="main-container">

    <!-- Conteúdo principal -->
    <section class="content">
      <!-- Player -->
      <div class="video-player">
        <iframe id="player" src="" title="Aula" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- Informações do vídeo -->
      <div class="video-info">
        <h2 id="video-title">Carregando...</h2>
        <p id="video-desc" class="descricao"></p>
        <div class="video-actions">
          <!-- Favoritar: terá ícone e texto; o JS atualiza o estado e aria-pressed -->
          <button id="fav-btn" class="btn" aria-pressed="false" title="Adicionar aos favoritos">
            <i class="fa-regular fa-heart" aria-hidden="true"></i>
            <span class="fav-label">Favoritar</span>
          </button>
        </div>
      </div>

      <!-- Feedback -->
      <div class="feedback">
        <h3>Deixe seu feedback</h3>
        <textarea id="feedback-text" placeholder="O que achou da aula?"></textarea>
        <button id="feedback-send">Enviar</button>
        <div id="feedback-list" style="margin-top:16px; text-align:left;"></div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>© 2025 Learnind — <a href="#">Termos</a> • <a href="#">Privacidade</a></p>
  </footer>
    <script>
      function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      async function loadVideo() {
        const id = getQueryParam('id');
        if (!id) {
          document.getElementById('video-title').textContent = 'Vídeo não especificado';
          return;
        }
        // request single video + favorite state from server
        try {
          console.log('[video] calling /video/get id=', id);
          const res = await fetch(`/video/get?id=${id}`, { credentials: 'include' });
          if (res.status === 404) {
            document.getElementById('video-title').textContent = 'Vídeo não encontrado';
            return;
          }
          if (!res.ok) {
            // if server requires auth for check, fall back to previous behavior
            console.warn('[video] /video/get failed, falling back', res.status);
            updateFavButton(false);
            return;
          }
          const json = await res.json();
          const v = json.video;
          const favorited = Boolean(json.favorited);
          document.getElementById('video-title').textContent = v.titulo || 'Sem título';
          document.getElementById('video-desc').textContent = v.descricao || '';
          const vid = v.url ? v.url.split('v=')[1] : null;
          if (vid) document.getElementById('player').src = `https://www.youtube.com/embed/${vid}`;
          // setup favorite button dataset
          const favBtn = document.getElementById('fav-btn');
          favBtn.dataset.videoId = v.idVideo;
          // Ensure we reliably reflect the DB favorite state on load by calling the lightweight
          // /favorito/check endpoint. If that fails, fall back to the 'favorited' value returned
          // by /video/get.
          try {
            const checkRes = await fetch(`/favorito/check?id=${encodeURIComponent(v.idVideo)}`, { credentials: 'include' });
            if (checkRes && checkRes.ok) {
              const checkJson = await checkRes.json();
              const favState = Boolean(checkJson.favorited);
              try { updateFavButton(favState); } catch (e) {}
            } else {
              try { updateFavButton(favorited); } catch (e) {}
            }
          } catch (e) {
            try { updateFavButton(favorited); } catch (err) {}
          }
        } catch (e) {
          console.error('[video] error loading video detail', e);
          updateFavButton(false);
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
      loadVideo();
      // after video loads, also load feedbacks
      (async () => {
        // wait a little to ensure video info loaded and dataset videoId set
        setTimeout(() => loadFeedbacks(), 200);
      })();
      // when the page becomes visible again (user switched tabs or navigated back), re-check favorite state
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') {
          try {
            const favBtn = document.getElementById('fav-btn');
            const vid = favBtn && favBtn.dataset.videoId;
            const idFromUrl = getQueryParam('id');
            const idToCheck = vid || idFromUrl;
            if (!idToCheck) return;
            const res = await fetch(`/video/get?id=${encodeURIComponent(idToCheck)}`, { credentials: 'include' });
            if (!res.ok) return; // keep current state if check fails
            const json = await res.json();
            const favorited = Boolean(json.favorited);
            try { updateFavButton(favorited); } catch (e) {}
          } catch (err) {
            console.error('[video] visibility check failed', err);
          }
        }
      });
      const favBtn = document.getElementById('fav-btn');
      favBtn.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const vid = btn.dataset.videoId;
        if (!vid) return;
        const body = new URLSearchParams();
        body.append('id_video', String(vid));
        try {
          const res = await fetch('/favorito/add', { method: 'POST', body: body, credentials: 'include' });
          if (res.ok) {
            alert('Vídeo favoritado com sucesso!');
            try { updateFavButton(true); } catch (e) {}
          } else if (res.status === 401) {
            // not authenticated
            window.location.href = '/login/login.html';
          } else if (res.status === 409) {
            // already favorited
            alert('Este vídeo já está nos seus favoritos.');
            try { updateFavButton(true); } catch (e) {}
          } else {
            const txt = await res.text().catch(() => 'Erro ao favoritar');
            alert(txt || 'Erro ao favoritar');
          }
        } catch (err) {
          console.error(err);
          alert('Erro de rede ao favoritar');
        }
      });

      // start a lightweight polling to keep favorite state in sync with DB
      // uses /favorito/check which returns { favorited: true/false }
      let favPollInterval = null;
      function startFavPolling() {
        stopFavPolling();
        favPollInterval = setInterval(async () => {
          try {
            const btn = document.getElementById('fav-btn');
            const vid = btn && btn.dataset.videoId;
            const idFromUrl = getQueryParam('id');
            const idToCheck = vid || idFromUrl;
            if (!idToCheck) return;
            const res = await fetch(`/favorito/check?id=${encodeURIComponent(idToCheck)}`, { credentials: 'include' });
            if (!res.ok) return; // ignore transient errors
            const json = await res.json();
            const fav = Boolean(json.favorited);
            try { updateFavButton(fav); } catch (e) {}
          } catch (err) {
            // ignore polling errors
          }
        }, 8000); // poll every 8 seconds
      }

      function stopFavPolling() {
        if (favPollInterval) { clearInterval(favPollInterval); favPollInterval = null; }
      }

      // start polling when page loads and stop on unload
      startFavPolling();
      window.addEventListener('beforeunload', () => stopFavPolling());

      function updateFavButton(fav) {
        const btn = document.getElementById('fav-btn');
        const icon = btn.querySelector('i');
        const label = btn.querySelector('.fav-label');
        if (fav) {
          // show a simple red heart and the message "Já favoritado"
          btn.classList.add('favorited');
          btn.setAttribute('aria-pressed', 'true');
          btn.setAttribute('title', 'Já favoritado');
          icon.classList.remove('fa-regular');
          icon.classList.add('fa-solid');
          // color the heart red and remove any other inline color when not favorited
          icon.style.color = '#e11d48'; /* red */
          label.textContent = 'Já favoritado';
        } else {
          btn.classList.remove('favorited');
          btn.setAttribute('aria-pressed', 'false');
          btn.setAttribute('title', 'Adicionar aos favoritos');
          icon.classList.remove('fa-solid');
          icon.classList.add('fa-regular');
          // reset any inline styles applied when favorited
          icon.style.color = '';
          label.textContent = 'Favoritar';
        }
      }
    });
    
    async function loadFeedbacks() {
      const id = getQueryParam('id');
      if (!id) return;
      try {
        const res = await fetch(`/feedbacks?videoId=${encodeURIComponent(id)}`, { credentials: 'include' });
        if (!res.ok) {
          console.warn('Falha ao carregar feedbacks', res.status);
          return;
        }
        const list = await res.json();
        const container = document.getElementById('feedback-list');
        container.innerHTML = '';
          if (!Array.isArray(list) || list.length === 0) {
            container.innerHTML = '<p style="color:#6b7280;">Seja o primeiro a comentar.</p>';
            return;
          }
          for (const content of list) {
            const node = document.createElement('div');
            node.className = 'feedback-item';
            node.style.padding = '8px 10px';
            node.style.border = '1px solid #e5e7eb';
            node.style.borderRadius = '8px';
            node.style.marginBottom = '8px';
            node.innerHTML = `<div style="font-size:0.95rem;color:#374151;">${escapeHtml(content)}</div>`;
            container.appendChild(node);
          }
      } catch (e) {
        console.error('Erro ao carregar feedbacks', e);
      }
    }

    document.getElementById('feedback-send').addEventListener('click', async (e) => {
      const txt = document.getElementById('feedback-text');
      const content = txt.value && txt.value.trim();
      const id = getQueryParam('id');
      if (!id) {
        alert('Vídeo não especificado');
        return;
      }
      if (!content) {
        alert('Escreva algo antes de enviar');
        return;
      }
      const body = new URLSearchParams();
      body.append('id_video', String(id));
      body.append('conteudo', content);
      try {
        const res = await fetch('/feedback/add', { method: 'POST', body: body, credentials: 'include' });
        if (res.ok) {
          txt.value = '';
          loadFeedbacks();
        } else if (res.status === 401) {
          window.location.href = '/login/login.html';
        } else {
          const txtResp = await res.text().catch(() => 'Erro');
          alert(txtResp || 'Erro ao enviar feedback');
        }
      } catch (err) {
        console.error(err);
        alert('Erro de rede ao enviar feedback');
      }
    });
    </script>
    <script>
      // set logo link depending on auth state (logged -> dashboard, else -> landing)
      (async () => {
        try {
          const res = await fetch('/usuario/me', { credentials: 'same-origin' });
          const el = document.getElementById('logo-link');
          if (el) el.href = (res && res.ok) ? '/homePage/dashboard.html' : '/landPage/index.html';
        } catch (e) {
          const el = document.getElementById('logo-link');
          if (el) el.href = '/landPage/index.html';
        }
      })();
    </script>
</body>
</html>
