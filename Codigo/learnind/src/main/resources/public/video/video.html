<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula - Learnind</title>
  <link rel="stylesheet" href="video.css">
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="container header-content">
      <h1 class="logo"><a id="logo-link" href="/landPage/index.html">Learnind</a></h1>

      <!-- search removed on this page (only on dashboard) -->

      <nav>
        <ul>
          <!-- navigation links removed; kept empty intentionally -->
        </ul>
      </nav>

      <!-- ÍCONE DE PERFIL -->
      <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Perfil" onclick="window.location.href='../perfil/perfil.html'" class="avatar">
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTAINER ===== -->
  <main class="main-container">

    <!-- Conteúdo principal -->
    <section class="content">
      <!-- Player -->
      <div class="video-player">
        <iframe id="player" src="" title="Aula" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <!-- Informações do vídeo -->
      <div class="video-info">
        <h2 id="video-title">Carregando...</h2>
        <p id="video-desc" class="descricao"></p>
        <div class="video-actions">
          <!-- Favoritar: terá ícone e texto; o JS atualiza o estado e aria-pressed -->
          <button id="fav-btn" class="btn" aria-pressed="false" title="Adicionar aos favoritos">
            <i class="fa-regular fa-heart" aria-hidden="true"></i>
            <span class="fav-label">Favoritar</span>
          </button>
        </div>
      </div>
  </footer>
    <script src="video.js"></script>
</body>
</html>
